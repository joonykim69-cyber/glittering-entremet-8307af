[build]
     functions = "netlify/functions"

   # ONBID_*_API_URL 계열은 data.go.kr 공개 API의 Base URL이라 비밀값이 아님 —
   # 시크릿 스캐너가 CLAUDE.md/함수 주석에 적힌 이 값들을 오탐해 배포를 막는 것 방지.
   # 진짜 비밀값(ONBID_SERVICE_KEY, ANTHROPIC_API_KEY)은 계속 스캔 대상.
   [build.environment]
     SECRETS_SCAN_OMIT_KEYS = "ONBID_API_URL,ONBID_DETAIL_API_URL,ONBID_MVAST_API_URL,ONBID_MVAST_DETAIL_API_URL,ONBID_BIDINFO_API_URL,ONBID_BIDRSLT_API_URL,ONBID_VHCL_API_URL"
     # ONBID_SVC_*_URL 계열(레지스트리 오버라이드)은 이름을 미리 열거할 수 없으므로,
     # 공개 Base URL이 원래부터 적혀 있는 파일들만 값-일치 스캔에서 제외한다.
     # (진짜 비밀값은 이 파일들에 존재하지 않으므로 보안 저하 없음)
     # 001_LIVE_VERIFICATION_CHECKLIST.md도 참조 문서라 공개 식별자(RONE 통계표 ID 등)를
     # 담아 값-일치 스캐너가 오탐 → CLAUDE.md와 동일하게 경로 제외. (이 주석/문서에는 실제
     # 식별자 값을 적지 않는다 — netlify.toml은 omit 대상이 아니라 값을 적으면 스캐너가 잡음.)
     SECRETS_SCAN_OMIT_PATHS = "CLAUDE.md,001_LIVE_VERIFICATION_CHECKLIST.md,netlify/functions/*"

   [functions]
     node_bundler = "esbuild"

   # ═══ 예측 장부 예약 실행 (UTC 크론 — KST-9h) ═══
   #
   # ⚠️ 외부 API 일일 한도: data.go.kr 온비드 계열은 인증키당 하루 1,000회다. 한도를 넘기면
   #    그날 남은 호출이 전부 실패하는데, 그 대가는 **사용자 화면(물건검색·지도·캘린더)**이 먼저
   #    치른다. 그래서 온비드를 호출하는 예약 함수는 lib/quota.js 예산 가드 아래에서만 돈다:
   #      · 'critical'(predict-daily·score-daily) — 막지 않되 사용량 기록
   #      · 'bulk'(collect-history·collect-backfill) — 남은 예산이 사용자 몫
   #        (ONBID_LIVE_RESERVE, 기본 250)까지 내려오면 커서를 남기고 중단
   #    사용량은 scoreboard의 apiQuota로 노출된다. 새 예약 함수가 온비드를 부르게 되면
   #    반드시 티어를 정해 가드를 붙일 것.
   # 07:00 KST 예측 봉인: 오늘~+2일 마감 물건의 예상 구간을 개찰 전에 기록
   [functions."predict-daily"]
     schedule = "0 22 * * *"
   # 19:30 KST 자동 채점: 당일 개찰 결과와 봉인 예측 대조 + 구간 폭 보정
   [functions."score-daily"]
     schedule = "30 10 * * *"
   # 20:10 KST 학습 데이터 수집: 과거 개찰 이력 백필(1년치) 후 신규분 증분 유지
   [functions."collect-history"]
     schedule = "10 11 * * *"
   # 20:40 KST 챌린저 v0.8 일일 학습: collect-history가 갱신한 이력으로 GBDT 재학습 →
   # hist/_gb08 아티팩트 저장(다음 날 07:00 봉인이 읽음). Blobs만 읽어 온비드 쿼터 무관.
   [functions."train-gb"]
     schedule = "40 11 * * *"
   # 일요일 21:00 KST 주간 감사(감사역 에이전트 ⑧): 채점 성적을 규칙 기반으로 감사해
   # chronicle에 개선 제안 기록(채택은 사람). 채점 표본 부족하면 no-op.
   [functions."audit-weekly"]
     schedule = "0 12 * * 0"
   # 모의 라이브 학습장(sim-live) 임시 스케줄 — 마스킹 과거를 월 단위로 재생하며 per-item 기록 생성.
   # 온비드 API를 안 부르고 Blobs만 읽으므로 쿼터 무관. 한 실행 = 한 달이고 재생 구간을 다 돌면 no-op.
   # (2026-07-31) 재생 구간은 이제 **수집 범위를 자동으로 따라간다** — 2025 백필이 끝나면 상태가
   # 초기화되어 202502~202606(17개월)을 처음부터 다시 재생한다(≈18회 실행 = 9시간). 그래서 이 스케줄은
   # "완료 후 제거"가 아니라 **수집이 더 넓어질 가능성이 없어질 때까지 유지**한다.
   # (2026-07-29 페이싱 완화: */15 → */30. 백필 완료 전엔 어차피 no-op이라 잦은 기동이 무의미하고,
   #  월당 1회 처리라 30분 간격이어도 진행 속도에 사실상 차이가 없다.)
   [functions."sim-live"]
     schedule = "*/30 * * * *"
   # (2026-08-02 제거) 2025 백필 임시 스케줄은 완료로 제거됨 — hist/_bfmeta.done=true,
   # 2025-01-01~2026-06-30 전수 404,120건(74창). collect-backfill 함수는 수동 GET 재실행용으로
   # 유지(스케줄이 없으면 수동 호출 403 제약도 없음). 범위를 더 넓히면(예: 2024) 이 자리에 재등록.
   # 시세 축 ⑤ RTMS 실거래 수집기 임시 스케줄 (2026-07-28 착수 — nowcast 봉인·채점의 데이터 레이어).
   # 서울 25구 × 주거 4종 × 최근 24개월 ≈ 2,400 셀-월을 완만 수집. RTMS는 낙찰가 엔진과 별개
   # 서비스 쿼터라 collect-backfill과 충돌 없음. 커서(mkt/rtms/_state.idx)가 끝에 도달하면 no-op →
   # 수집 완료 후 이 스케줄 제거 예정. (2026-07-29 페이싱 완화: */20 → */30)
   [functions."collect-rtms"]
     schedule = "*/30 * * * *"
   # 시세 축 ⑤ 2단계 nowcast 백테스트 — mkt/rtms/* 블롭만 읽어 시세 추정 정합도 산출(외부 API 미호출).
   # RTMS가 쌓이는 동안 매시간 정합도 갱신, 미수집이면 no-op. 낙찰가 백테스트(backtest)와 별개.
   [functions."mkt-backtest"]
     schedule = "25 * * * *"
   # 시세 축 ⑤ 3단계 시세 밴드 봉인·채점 — KST 07:20(낙찰가 봉인 07:00 직후). 각 셀의 이번 달
   # 밴드를 불변 봉인하고, 다음 달 실거래가 도착한 과거 봉인을 채점(멱등). 블롭만 읽고 씀.
   [functions."mkt-seal-daily"]
     schedule = "20 22 * * *"
   # 관심물건 마감 알림 — KST 08:00(= 23:00 UTC). D-3/D-1/당일 단계로 1회씩만 발송(멱등).
   # RESEND_API_KEY 미설정 시 계산만 하고 발송하지 않는다(보낸 척 금지).
   [functions."alert-daily"]
     schedule = "0 23 * * *"
   # (2026-08-02) 마스킹 백필은 2026 1~6월(07-23)·2025 전체(08-01)까지 완료 — 커서 20241231 도달.
   # 챌린저 백테스트 임시 스케줄 (2026-07-28 v0.8 비교용 재활성 — BT_VERSION v4-gbtree 범프됨).
   # backtest.js가 bt/_state의 version이나 **range**가 다르면 처음부터 재실행하므로, 이 크론이
   # v0.5 vs v0.7 vs v0.8을 walk-forward로 자동 채점한다. backfill(hist/_bfmeta.done) 완료 전엔
   # no-op이고 전 단계 완료 후에도 no-op이므로, 2025 백필이 끝나면 비교가 저절로 돌고 끝난 뒤엔
   # 조용히 멈춘다. (2026-07-31) 단계는 이제 **수집 범위를 자동으로 따라간다** — 18개월이면
   # 3·9·15개월 학습으로 늘어나고, 학습은 한 실행 = 한 달로 누적하므로 ≈21회 실행(10시간)이 필요하다.
   # (2026-07-29 페이싱 완화: */6 → */30. 2025 백필이 끝나기 전까지는 매 기동이 no-op이라
   #  하루 240회를 도는 이유가 없다. 백필 완료 후 단계별 재개는 30분 간격으로도 충분하다.)
   [functions."backtest"]
     schedule = "*/30 * * * *"

   # 루트(/)는 낙찰예보(BidCast) 랜딩으로 안내.
   # force = true: 루트에 파일이 실존하면 Netlify는 기본적으로 리다이렉트보다 파일을 우선하므로 유지.
   [[redirects]]
     from = "/"
     to = "/bidcast.html"
     status = 302
     force = true
