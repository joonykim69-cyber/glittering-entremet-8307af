[build]
     functions = "netlify/functions"

   # ONBID_API_URL은 공개 API의 Base URL이라 비밀값이 아님 — 시크릿 스캐너가
   # CLAUDE.md/onbid-search.js 주석에 적힌 이 값을 오탐해 배포를 막는 것 방지
   [build.environment]
     SECRETS_SCAN_OMIT_KEYS = "ONBID_API_URL"

   [functions]
     node_bundler = "esbuild"

   # 루트(/)는 낙찰예보(BidCast) 랜딩으로 안내 — K-Map Linker 랜딩은 /index.html로 직접 접근 가능.
   # force = true 필수: 루트에 index.html이 실존하면 Netlify는 기본적으로 리다이렉트보다 파일을 우선함.
   [[redirects]]
     from = "/"
     to = "/bidcast.html"
     status = 302
     force = true
